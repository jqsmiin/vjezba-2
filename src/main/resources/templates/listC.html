<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Reservations</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            padding: 40px;
        }
        
        h1 {
            color: #2d3748;
            font-size: 2.5rem;
            margin-bottom: 30px;
            text-align: center;
        }
        
        .action-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #e2e8f0;
        }
        
        .btn {
            background: #667eea;
            color: white;
            text-decoration: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-weight: 600;
            transition: all 0.3s ease;
            display: inline-block;
            border: none;
            cursor: pointer;
        }
        
        .btn:hover {
            background: #5568d3;
            transform: translateY(-1px);
            box-shadow: 0 4px 8px rgba(102, 126, 234, 0.3);
        }
        
        .btn-success {
            background: #48bb78;
        }
        
        .btn-success:hover {
            background: #38a169;
        }
        
        .btn-danger {
            background: #f56565;
            padding: 8px 16px;
            font-size: 0.9rem;
        }
        
        .btn-danger:hover {
            background: #e53e3e;
        }
        
        .btn-warning {
            background: #ed8936;
            padding: 8px 16px;
            font-size: 0.9rem;
            margin-right: 8px;
        }
        
        .btn-warning:hover {
            background: #dd6b20;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 30px;
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        
        thead {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        th {
            padding: 15px;
            text-align: left;
            font-weight: 600;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        td {
            padding: 15px;
            border-bottom: 1px solid #e2e8f0;
            color: #2d3748;
        }
        
        tbody tr {
            transition: background-color 0.2s ease;
        }
        
        tbody tr:hover {
            background-color: #f7fafc;
        }
        
        tbody tr:last-child td {
            border-bottom: none;
        }
        
        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: 600;
        }
        
        .badge-pending {
            background: #fef3c7;
            color: #92400e;
        }
        
        .badge-confirmed {
            background: #c6f6d5;
            color: #22543d;
        }
        
        .badge-cancelled {
            background: #fed7d7;
            color: #742a2a;
        }
        
        .nav-links {
            text-align: center;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 2px solid #e2e8f0;
        }
        
        .nav-links a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
            font-size: 1.1rem;
            margin: 0 15px;
        }
        
        .nav-links a:hover {
            color: #5568d3;
            text-decoration: underline;
        }
        
        .empty-state {
            text-align: center;
            padding: 60px;
            color: #718096;
            font-size: 1.1rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📅 Reservations</h1>
        
        <div class="action-bar">
            <h2 style="color: #4a5568; font-size: 1.3rem;">All Reservations</h2>
            <a href="/c/new" class="btn btn-success">+ New Reservation</a>
        </div>
        
        <table th:if="${reservations != null and !#lists.isEmpty(reservations)}">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Guest Name</th>
                    <th>Hotel</th>
                    <th>Check-In</th>
                    <th>Check-Out</th>
                    <th>Guests</th>
                    <th>Total Price</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="r : ${reservations}">
                    <td th:text="${r.id}">1</td>
                    <td th:text="${r.guestName}">John Doe</td>
                    <td th:text="${r.hotel.name}">Hotel Name</td>
                    <td th:text="${#temporals.format(r.checkInDate, 'dd/MM/yyyy')}">01/01/2024</td>
                    <td th:text="${#temporals.format(r.checkOutDate, 'dd/MM/yyyy')}">05/01/2024</td>
                    <td th:text="${r.numberOfGuests}">2</td>
                    <td>$<span th:text="${r.totalPrice}">300.0</span></td>
                    <td>
                        <span th:if="${r.status == 'PENDING'}" class="badge badge-pending">Pending</span>
                        <span th:if="${r.status == 'CONFIRMED'}" class="badge badge-confirmed">Confirmed</span>
                        <span th:if="${r.status == 'CANCELLED'}" class="badge badge-cancelled">Cancelled</span>
                    </td>
                    <td>
                        <a th:href="@{/c/edit/{id}(id=${r.id})}" class="btn btn-warning">Edit</a>
                        <a th:href="@{/c/delete/{id}(id=${r.id})}" class="btn btn-danger" 
                           onclick="return confirm('Are you sure you want to delete this reservation?')">Delete</a>
                    </td>
                </tr>
            </tbody>
        </table>
        
        <div class="empty-state" th:if="${reservations == null or #lists.isEmpty(reservations)}">
            No reservations available. Create your first reservation!
        </div>
        
        <div class="nav-links">
            <a href="/a">Hotels</a>
            <a href="/b">Rooms</a>
        </div>
    </div>
</body>
</html>
